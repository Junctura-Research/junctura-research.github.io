# Intersections and Junctions: the single list the site is built from.
#
# Intersection = two or more technologies. Junction = the specific focus within
# an intersection that an Intersection Report covers. Each published document
# names its Junction in its front matter (junction: <id>); the build stops if a
# document names a Junction that is not listed here.
#
# An Intersection page is built only once it has at least one published document.
# Images: images/intersections/<image>-banner.jpg, -og.jpg, -thumb.jpg
# (made by scripts/make_images.py from the private originals).

